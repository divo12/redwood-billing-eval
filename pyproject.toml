[project]
name = "observe-bench"
version = "0.1.0"
description = "Agent-building evals over Redwood Inference, a company from EnterpriseRAG-Bench."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C90", "UP", "SIM", "RET", "ANN", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
mypy_path = "tasks/redwood-devsupport/environment:tasks/redwood-devsupport/tests"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
